<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:replace="header::copy"></div>
<table>
    <tr>
        <th>STT</th>
        <th>ID</th>
        <th>Name</th>
        <th>PRICE</th>
        <th>STATUS</th>
        <th>ACTICON</th>
    </tr>
    <tr th:each="customer,iterStat:${product}">
        <td th:text="${iterStat.count}"></td>
        <td th:text="${customer.id}"></td>
        <td th:text="${customer.name}"></td>
        <td th:text="${customer.price}"></td>
        <td>
            <span th:if="${customer.inStock}">Còn hàng</span>
            <span th:unless="${customer.inStock}">Hết hàng</span>
        </td>
        <td><a th:href="@{/product/detail(id=${customer.id})}">
            Chi tiết
        </a>
        </td>


    </tr>

</table>
<div th:replace="footer::copy"></div>


</body>
</html>
